spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:marketplace;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
    username: sa
    password:
  sql:
    init:
      mode: always
      encoding: UTF-8
  main:
    banner-mode: "off"

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    map-underscore-to-camel-case: true
