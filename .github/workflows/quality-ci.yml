name: Quality CI

on:
  push:
    branches:
      - Backend
      - quality-evidence-sprint
  pull_request:
    branches:
      - Backend
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and package
    runs-on: ubuntu-latest
    steps:
      - name: Check out backend
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Verify backend
        run: mvn --batch-mode clean verify

      - name: Upload backend test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-evidence
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: warn

  frontend:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out frontend branch
        uses: actions/checkout@v4
        with:
          ref: Frontend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run frontend acceptance contracts
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-production-build
          path: dist/
